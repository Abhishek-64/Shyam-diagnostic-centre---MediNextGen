<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="sdc_teal_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#009960" />
      <stop offset="100%" stop-color="#143566" />
    </linearGradient>
    <linearGradient id="sdc_pulse_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#00bf78" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="sdc_shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#143566" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="120" cy="120" r="110" fill="#ffffff" filter="url(#sdc_shadow)" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Outer Modern Gradient Tech Ring -->
  <circle cx="120" cy="120" r="102" fill="none" stroke="url(#sdc_teal_emerald)" stroke-width="6" stroke-dasharray="14 6" opacity="0.85" />
  <circle cx="120" cy="120" r="92" fill="#f8fafc" />

  <!-- Medical Cross Geometry in Deep Navy -->
  <rect x="100" y="44" width="40" height="152" rx="12" fill="#143566" />
  <rect x="44" y="100" width="152" height="40" rx="12" fill="#143566" />

  <!-- Center Highlight Core (Vibrant Green & Cyan) -->
  <rect x="104" y="48" width="32" height="144" rx="8" fill="#1c4885" />
  <rect x="48" y="104" width="144" height="32" rx="8" fill="#1c4885" />

  <!-- Overlaid Dynamic ECG Pulse Wave in Clinical Green -->
  <path d="M 46 120 L 82 120 L 96 92 L 112 152 L 128 78 L 142 136 L 154 120 L 194 120" 
        fill="none" 
        stroke="url(#sdc_pulse_grad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- DNA / Biomarker Molecular Nodes -->
  <circle cx="120" cy="62" r="7" fill="#00bf78" stroke="#ffffff" stroke-width="2" />
  <circle cx="120" cy="178" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
  <circle cx="62" cy="120" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
  <circle cx="178" cy="120" r="7" fill="#00bf78" stroke="#ffffff" stroke-width="2" />

  <!-- Inner Sparkle Diagnostic Sensor -->
  <circle cx="128" cy="78" r="4" fill="#fde047" />
  <circle cx="112" cy="152" r="4" fill="#38bdf8" />
</svg>
