services:
  # ------------------------------------------------------------------
  # Backend Web Service (Node.js + Express API)
  # ------------------------------------------------------------------
  - type: web
    name: shyam-diagnostic-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGINS
        value: https://shyam-diagnostic-frontend.onrender.com
      - key: DB_HOST
        value: shyam-diagnostic-shyam-diagnostic.d.aivencloud.com
      - key: DB_PORT
        value: 12980
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        value: AVNS_UfrYqSGnRE8-wLU7ypl
      - key: DB_SSL
        value: true

  # ------------------------------------------------------------------
  # Frontend Static Site (React + Vite SPA)
  # ------------------------------------------------------------------
  - type: web
    name: shyam-diagnostic-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: shyam-diagnostic-backend
          property: url
          format: ${value}/api/v1
